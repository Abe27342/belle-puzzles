name: Azure Static Web Apps CI/CD

on:
    push:
        branches:
            - main
    pull_request:
        # types: [closed]
        branches:
            - main

jobs:
    build_and_deploy_job:
        # if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        name: Build and Deploy Job
        steps:
            - uses: actions/checkout@v2
              with:
                  submodules: true
            - name: Enable corepack
              run: corepack enable

            - name: Install dependencies
              run: pnpm i

            - name: Run build
              run: npm run build

            - name: Run tests
              run: npm run test

            - name: Build And Deploy
              id: builddeploy
              uses: Azure/static-web-apps-deploy@v1
              with:
                  azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_SMOKE_08A64B310 }}
                  repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
                  action: 'upload'
                  ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
                  # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
                  app_location: '/packages/site'
                  api_location: '/packages/site-api'
                  output_location: '/dist'
                  ###### End of Repository/Build Configurations ######
              env:
                  CUSTOM_BUILD_COMMAND: npm run build
                  VERBOSE: true

            - name: Capture Oryx build output
              if: always()
              run: |
                  echo "=== Checking for Oryx build artifacts ==="
                  if [ -d "/home/runner/work/_temp/_github_home/.oryx" ]; then
                    echo "Found Oryx directory"
                    ls -la /home/runner/work/_temp/_github_home/.oryx/
                  fi
                  if [ -d "/tmp/oryx" ]; then
                    echo "Found temp Oryx directory"
                    ls -la /tmp/oryx/
                  fi

            - name: Create deployment snapshot
              if: always()
              run: |
                  echo "=== Pre-deployment API structure ==="
                  cd packages/site-api
                  find . -type f -name "*.js" -o -name "*.json" -o -name "*.ts"
                  echo ""
                  echo "=== package.json ==="
                  cat package.json
                  echo ""
                  echo "=== Creating snapshot zip ==="
                  zip -r ../../pre-deployment-api.zip .

            - name: Upload pre-deployment snapshot
              if: always()
              uses: actions/upload-artifact@v3
              with:
                  name: pre-deployment-api-snapshot
                  path: pre-deployment-api.zip
                  retention-days: 7
